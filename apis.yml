aid: haven-energy
name: Haven Energy
description: >-
  Haven Energy is an Austin, Texas based residential clean-energy company that sells, finances,
  installs and operates home battery storage and solar systems, and then aggregates those systems
  into one of the largest virtual power plant (VPP) networks in the United States. Homeowners get an
  instant online quote, a fixed monthly payment over a ten-year term, end-to-end permitting and
  certified installation through Haven's Channel Partner network of local electricians, and ongoing
  remote monitoring. Haven then enrolls the installed batteries into utility and grid programs -
  California SGIP, PG&E, and Massachusetts ConnectedSolutions among them - so customers can monetize
  grid participation while utilities and community choice aggregators gain flexible local capacity.
  Founded in 2022 by Jeff Chapin, Philip Krim and Vinnie Campos, the company raised a $40M Series B
  in December 2025 led by Giant Ventures. Haven operates as a direct-to-consumer and utility-partner
  business; it publishes no public developer program, API, or machine-readable API contract.
